<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>气闸孤注：γ-7 · Airlock Ante</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/deepspace.css" />
</head>
<body>
<div id="app">

  <!-- 开场 -->
  <div id="startScreen" class="overlay">
    <div class="title">气闸孤注：γ-7</div>
    <div class="subtitle">γ-7 气闸厅 · 实弹与空包的对赌</div>
    <p class="brief">
      补给在三个月前耗尽。这座废弃中转站只剩两件东西：一把混着实芯弹与空包弹的脉冲钉枪，
      和坐在你对面、被称作「仲裁者」的站务核心。<br><br>
      轮流扣下扳机。抵住自己赌一发空响以保住回合，或瞄准它——但你永远不知道下一发是实是空。
      三局递减的血量，越打越满的弹仓。活下来。
    </p>
    <button class="btn-major" id="enterBtn">进 入 气 闸</button>
    <div class="warn">建议佩戴耳机 · 含强烈音效、闪烁与画面震动</div>
  </div>

  <!-- 战场 -->
  <main id="board" hidden>
    <header id="hud">
      <div id="roundTag">第一局</div>
      <div id="winsTag"></div>
    </header>

    <section class="combatants">
      <div class="fighter opp" id="oppPanel"></div>
      <div class="chamber" id="chamber"></div>
      <div class="fighter you" id="youPanel"></div>
    </section>

    <section class="controls" id="controls" aria-disabled="true">
      <button class="shoot-self" id="shootSelf" disabled>抵住自己 · 扣下扳机</button>
      <button class="shoot-opp" id="shootOpp" disabled>瞄准仲裁者 · 开枪</button>
      <div id="itemBar"></div>
      <div class="hint" id="hint"></div>
    </section>
  </main>

  <!-- 怜悯抉择 -->
  <div id="mercyScreen" class="overlay" hidden>
    <div class="verdict">怜 悯 抉 择</div>
    <p class="flavor" id="mercyText"></p>
    <div class="mercy-actions">
      <button class="grant" id="mercyGrant">赦免 · 拖它回场</button>
      <button class="exec" id="mercyExec">处决 · 收下胜利</button>
    </div>
  </div>

  <!-- 结算 -->
  <div id="endScreen" class="overlay" hidden></div>

  <!-- 战斗日志 -->
  <aside id="log"></aside>

  <!-- 全屏特效层 -->
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
</div>

<script type="module" src="./js/deepspace-ui.mjs"></script>
</body>
</html>
